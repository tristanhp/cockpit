name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The versioned migrations must build the whole schema from an empty database.
      - run: DATABASE_URL=file:data/ci-migrate.db npm run db:migrate
      # The demo database exercises the schema and the fictional dataset end to end.
      - run: npm run demo:setup
      - run: npm run build
        env:
          COCKPIT_DEMO: "1"
          DATABASE_URL: file:data/demo.db
